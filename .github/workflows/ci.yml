name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketplace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway values for the test database and test-only secrets.
      DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace?schema=public
      AUTH_SECRET: ci-only-auth-secret-not-for-production-use
      AUTH_URL: http://localhost:3100
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      SEED_PASSWORD: Password123!
      PAYMENT_PROVIDER: test
      PAYMENT_WEBHOOK_SECRET: ci-only-webhook-secret-0123456789
      CRON_SECRET: ci-only-cron-secret-0123456789
      DATA_ENCRYPTION_KEY: Y2ktb25seS0zMi1ieXRlLWVuY3J5cHRpb24ta2V5ISE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
